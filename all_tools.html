<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTK Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',system-ui,sans-serif}
.custom-scroll::-webkit-scrollbar{width:4px} .custom-scroll::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:10px}
</style>
</head>
<body class="bg-[#fcfcfd] text-slate-800 h-screen w-screen overflow-hidden flex">
<!-- Sidebar -->
<aside id="sidebar" class="w-[320px] shrink-0 bg-white border-r border-slate-200 flex flex-col h-full z-20 fixed lg:static inset-y-0 left-0 -translate-x-full lg:translate-x-0 transition-transform">
  <div class="h-[56px] px-5 flex items-center justify-between border-b border-slate-100 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center text-[12px] font-bold">T</div>
      <span class="text-[13px] font-semibold tracking-tight">TTK</span>
    </div>
    <button id="closeSidebar" class="lg:hidden w-7 h-7 rounded-lg border border-slate-200 flex items-center justify-center text-[12px]">✕</button>
  </div>

  <div class="p-3 border-b border-slate-100 shrink-0 space-y-2">
    <input id="searchInput" placeholder="Search" class="w-full h-9 px-3 rounded-lg border border-slate-200 bg-slate-50 text-[13px] focus:outline-none focus:border-slate-300">
    <div id="licenseStatus" class="hidden px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-200 flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-[10px] font-semibold text-emerald-700">ACTIVE</span>
      <span id="countdown" class="ml-auto text-[10px] font-mono text-emerald-700"></span>
    </div>
  </div>

  <div id="sidebarContent" class="flex-1 overflow-y-auto custom-scroll p-2 space-y-4"></div>
</aside>

<!-- Main -->
<div class="flex-1 flex flex-col h-full min-w-0 bg-white">
  <div class="h-[56px] shrink-0 border-b border-slate-200 flex items-center justify-between px-4 bg-white">
    <div class="flex items-center gap-2 min-w-0">
      <button id="openSidebar" class="lg:hidden w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center">☰</button>
      <span id="topTitle" class="text-[13px] font-medium truncate"></span>
      <span id="liveBadge" class="hidden ml-2 px-2 py-0.5 rounded-full bg-slate-900 text-white text-[9px] font-bold">LIVE</span>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <span id="topCountdown" class="hidden text-[10px] font-mono text-emerald-700 mr-2"></span>
      <button id="openNewTab" disabled class="hidden h-7 w-7 rounded-lg border border-slate-200 flex items-center justify-center text-[12px] disabled:opacity-30">↗</button>
      <button id="reloadTool" disabled class="hidden h-7 w-7 rounded-lg border border-slate-200 flex items-center justify-center text-[12px] disabled:opacity-30">↻</button>
      <button id="closePreview" class="hidden h-7 px-2.5 rounded-lg border border-slate-200 text-[11px] font-medium">Close</button>
    </div>
  </div>

  <div class="flex-1 relative overflow-hidden bg-[#fcfcfd]">
    <!-- CLEAN DASHBOARD - EMPTY BY DEFAULT -->
    <div id="dashboardView" class="absolute inset-0 bg-white"></div>
    <!-- PREVIEW ONLY ON CLICK -->
    <div id="previewView" class="absolute inset-0 hidden flex-col bg-white">
      <iframe id="toolFrame" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-modals"></iframe>
    </div>
  </div>
</div>

<!-- Unlock Modal -->
<div id="unlockModal" class="fixed inset-0 z-50 hidden">
  <div id="unlockBackdrop" class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="w-full max-w-[360px] rounded-2xl bg-white border border-slate-200 shadow-xl p-5">
      <h3 class="text-[14px] font-semibold">Enter Password</h3>
      <p id="unlockMessage" class="mt-1 text-[12px] text-slate-500"></p>
      <input id="passwordInput" type="password" placeholder="Password" class="mt-4 h-10 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 text-[13px] focus:outline-none focus:border-slate-900">
      <p id="errorMsg" class="mt-2 hidden text-[11px] text-red-600"></p>
      <p id="successMsg" class="mt-2 hidden text-[11px] text-emerald-600"></p>
      <button id="unlockBtn" class="mt-4 h-10 w-full rounded-xl bg-slate-900 text-white text-[13px] font-medium hover:bg-black">Unlock</button>
    </div>
  </div>
</div>

<!-- Expired Modal -->
<div id="expiredModal" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="w-full max-w-[340px] rounded-2xl bg-white border p-5 text-center">
      <p class="text-[13px] font-semibold">License Expired</p>
      <p class="mt-1 text-[12px] text-slate-500">Enter a new password to unlock tools.</p>
      <button id="expiredUnlockBtn" class="mt-4 h-10 w-full rounded-xl bg-slate-900 text-white text-[13px]">New Password</button>
    </div>
  </div>
</div>

<!-- Revoked Modal -->
<div id="revokedModal" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="w-full max-w-[340px] rounded-2xl bg-white border p-5 text-center">
      <p class="text-[13px] font-semibold">Password Revoked</p>
      <p class="mt-1 text-[12px] text-slate-500">This password is no longer valid.</p>
      <button id="revokedUnlockBtn" class="mt-4 h-10 w-full rounded-xl bg-slate-900 text-white text-[13px]">Enter New</button>
    </div>
  </div>
</div>

function fmt(ms){ const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000); return `${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
async function sha256(s){ const b=new TextEncoder().encode(s); const h=await crypto.subtle.digest('SHA-256',b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function loadReg(){ try{ const r=localStorage.getItem(STORAGE_REGISTRY); if(r) registry=JSON.parse(r); }catch{} }
function loadLic(){ try{ const r=localStorage.getItem(STORAGE_CURRENT); if(r) return JSON.parse(r); }catch{} return null; }
function saveReg(){ localStorage.setItem(STORAGE_REGISTRY, JSON.stringify(registry)); }
function saveLic(l){ localStorage.setItem(STORAGE_CURRENT, JSON.stringify(l)); }
function clearLic(){ localStorage.removeItem(STORAGE_CURRENT); }
function checkLic(l){ if(!l||!l.hash||!l.expiry) return {valid:false,reason:'no_license'}; if(!HASHES.includes(l.hash)) return {valid:false,reason:'revoked'}; if(l.expiry<=Date.now()) return {valid:false,reason:'expired'}; const reg=registry[l.hash]; if(reg&&reg.expiry<=Date.now()) return {valid:false,reason:'expired'}; return {valid:true}; }

function lockAll(reason){
  isLocked=true; currentLicense=null; clearLic(); if(timer){clearInterval(timer);timer=null;}
  els.licenseStatus.classList.add('hidden');
  els.topCountdown.classList.add('hidden');
  els.liveBadge.classList.add('hidden');
  els.openNewTab.classList.add('hidden'); els.reloadTool.classList.add('hidden'); els.closePreview.classList.add('hidden');
  els.openNewTab.disabled=true; els.reloadTool.disabled=true;
  // Show empty dashboard, hide preview
  els.dashboardView.classList.remove('hidden');
  els.previewView.classList.add('hidden'); els.previewView.classList.remove('flex');
  els.topTitle.textContent='';
  els.toolFrame.src='about:blank'; selectedTool=null;
  renderTools(els.searchInput.value||'');
  if(reason==='expired'){ els.expiredModal.classList.remove('hidden'); }
  else if(reason==='revoked'){ els.revokedModal.classList.remove('hidden'); }
}

function unlockAll(lic){
  isLocked=false; currentLicense=lic;
  els.licenseStatus.classList.remove('hidden');
  els.expiredModal.classList.add('hidden'); els.revokedModal.classList.add('hidden'); els.unlockModal.classList.add('hidden');
  startTimer(); renderTools(els.searchInput.value||'');
}

function startTimer(){
  if(timer) clearInterval(timer);
  const tick=()=>{
    if(!currentLicense) return;
    if(!HASHES.includes(currentLicense.hash)){ lockAll('revoked'); return; }
    const rem=currentLicense.expiry-Date.now();
    if(rem<=0){ lockAll('expired'); return; }
    els.countdown.textContent=fmt(rem);
    els.topCountdown.textContent=fmt(rem);
    els.topCountdown.classList.remove('hidden');
  };
  tick(); timer=setInterval(tick,1000);
}

function filteredTools(q){ const s=q.trim().toLowerCase(); if(!s) return TOOLS; return TOOLS.filter(t=>t.name.toLowerCase().includes(s)); }

function renderTools(q=""){
  const list=filteredTools(q);
  els.sidebarContent.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const catTools=list.filter(t=>cat.cats.includes(t.category));
    if(catTools.length===0) return;
    const wrap=document.createElement('div');
    wrap.innerHTML=`<p class="px-2 mb-1.5 text-[10px] font-semibold tracking-widest text-slate-400 uppercase">${cat.label}</p><div class="space-y-0.5"></div>`;
    const cont=wrap.querySelector('div');
    catTools.forEach(t=>cont.appendChild(makeBtn(t)));
    els.sidebarContent.appendChild(wrap);
  });
}

function makeBtn(tool){
  const sel=selectedTool&&selectedTool.id===tool.id;
  const btn=document.createElement('button');
  // Locked style: disabled look, but still clickable to trigger unlock modal
  btn.className=`w-full text-left px-2.5 py-2 rounded-lg flex items-center gap-2.5 transition text-[13px] ${sel?'bg-slate-900 text-white':'hover:bg-slate-50 text-slate-700'} ${isLocked?'opacity-60':''}`;
  btn.disabled = isLocked ? false : false; // keep clickable even when locked to trigger unlock
  if(isLocked){
    btn.innerHTML=`<span class="w-5 h-5 rounded-md bg-slate-100 border flex items-center justify-center text-[10px]">🔒</span><span class="truncate flex-1">${tool.name}</span>`;
    // visually locked but still allows click to open unlock modal
    btn.classList.add('cursor-pointer');
  } else {
    btn.innerHTML=`<span class="w-5 h-5 rounded-md ${sel?'bg-white/15':'bg-slate-100'} flex items-center justify-center text-[10px]">${sel?'●':'○'}</span><span class="truncate flex-1">${tool.name}</span>`;
  }
  btn.onclick=()=>handleClick(tool);
  return btn;
}

function handleClick(tool){
  pendingTool=tool;
  if(isLocked){
    els.unlockMessage.textContent = tool.name;
    els.passwordInput.value=''; els.errorMsg.classList.add('hidden'); els.successMsg.classList.add('hidden');
    els.unlockModal.classList.remove('hidden'); setTimeout(()=>els.passwordInput.focus(),50);
    return;
  }
  openPreview(tool);
}

function openPreview(tool){
  selectedTool=tool;
  els.dashboardView.classList.add('hidden');
  els.previewView.classList.remove('hidden'); els.previewView.classList.add('flex');
  els.topTitle.textContent=tool.name;
  els.liveBadge.classList.remove('hidden');
  els.openNewTab.classList.remove('hidden'); els.reloadTool.classList.remove('hidden'); els.closePreview.classList.remove('hidden');
  els.openNewTab.disabled=false; els.reloadTool.disabled=false;
  els.toolFrame.src=encodeURI(tool.fileName);
  renderTools(els.searchInput.value||'');
  els.sidebar.classList.add('-translate-x-full'); els.sidebar.classList.remove('translate-x-0');
}

function closePreviewFunc(){
  els.previewView.classList.add('hidden'); els.previewView.classList.remove('flex');
  els.dashboardView.classList.remove('hidden');
  els.topTitle.textContent=''; els.liveBadge.classList.add('hidden');
  els.openNewTab.classList.add('hidden'); els.reloadTool.classList.add('hidden'); els.closePreview.classList.add('hidden');
  els.toolFrame.src='about:blank'; selectedTool=null; renderTools(els.searchInput.value||'');
}

async function doUnlock(){
  const pwd=els.passwordInput.value.trim();
  els.errorMsg.classList.add('hidden'); els.successMsg.classList.add('hidden');
  if(!pwd){ els.errorMsg.textContent='Enter password'; els.errorMsg.classList.remove('hidden'); return; }
  els.unlockBtn.disabled=true; els.unlockBtn.textContent='Checking...';
  try{
    const hash=await sha256(pwd);
    if(!HASHES.includes(hash)){ els.errorMsg.textContent='Invalid'; els.errorMsg.classList.remove('hidden'); return; }
    const now=Date.now(); const ex=registry[hash];
    if(ex&&ex.expiry<=now){ els.errorMsg.textContent='Expired'; els.errorMsg.classList.remove('hidden'); return; }
    let lic;
    if(ex){ lic={hash, firstUsed:ex.firstUsed, expiry:ex.expiry}; }
    else{ const expiry=now+THIRTY_DAYS; registry[hash]={firstUsed:now, expiry}; saveReg(); lic={hash, firstUsed:now, expiry}; }
    saveLic(lic); currentLicense=lic;
    els.successMsg.textContent='Unlocked'; els.successMsg.classList.remove('hidden');
    setTimeout(()=>{ unlockAll(lic); if(pendingTool) openPreview(pendingTool); }, 400);
  }catch{ els.errorMsg.textContent='Error'; els.errorMsg.classList.remove('hidden'); }
  finally{ els.unlockBtn.disabled=false; els.unlockBtn.textContent='Unlock'; }
}

function init(){
  loadReg();
  const lic=loadLic();
  if(lic){ const c=checkLic(lic); if(c.valid){ currentLicense=lic; unlockAll(lic); } else lockAll(c.reason); }
  else lockAll('no_license');
  renderTools('');
  els.searchInput.addEventListener('input', e=>renderTools(e.target.value));
  els.unlockBtn.addEventListener('click', doUnlock);
  els.passwordInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doUnlock(); });
  $('closeUnlock')?.addEventListener('click', ()=>els.unlockModal.classList.add('hidden'));
  els.unlockBackdrop.addEventListener('click', ()=>els.unlockModal.classList.add('hidden'));
  els.expiredUnlockBtn.addEventListener('click', ()=>{ els.expiredModal.classList.add('hidden'); els.unlockModal.classList.remove('hidden'); });
  els.revokedUnlockBtn.addEventListener('click', ()=>{ els.revokedModal.classList.add('hidden'); els.unlockModal.classList.remove('hidden'); });
  els.openNewTab.addEventListener('click', ()=>{ if(selectedTool) window.open(encodeURI(selectedTool.fileName),'_blank'); });
  els.reloadTool.addEventListener('click', ()=>{ try{ els.toolFrame.contentWindow.location.reload(); }catch{ els.toolFrame.src=els.toolFrame.src; } });
  els.closePreview.addEventListener('click', closePreviewFunc);
  els.openSidebar.addEventListener('click', ()=>{ els.sidebar.classList.remove('-translate-x-full'); els.sidebar.classList.add('translate-x-0'); });
  els.closeSidebar.addEventListener('click', ()=>{ els.sidebar.classList.add('-translate-x-full'); els.sidebar.classList.remove('translate-x-0'); });
  setInterval(()=>{ if(!isLocked&&currentLicense){ const c=checkLic(currentLicense); if(!c.valid) lockAll(c.reason); } },5000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
